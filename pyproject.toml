[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpx2print"
version = "1.1.0"
description = "Turn a GPX track into a 3D-printable topographic map with a separate, colour-printable trail insert"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["gpx", "3d-printing", "3mf", "topographic", "map", "hiking", "dem"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "gpxpy>=1.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28",
    "pillow>=9.0",
    "trimesh>=4.0",
    # Used by trimesh rather than imported here: manifold3d performs the boolean
    # cuts, mapbox_earcut triangulates polygons for extrusion. Without them
    # trimesh imports fine and then fails when the geometry is built.
    "manifold3d>=2.3",
    "mapbox_earcut>=1.0",
]

[project.scripts]
gpx2print = "gpx2print.cli:main"

[project.gui-scripts]
gpx2print-gui = "gpx2print.gui:main"

[tool.setuptools]
packages = ["gpx2print"]
